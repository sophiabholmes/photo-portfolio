<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sophia Bennett Holmes — Photo Portfolio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="site-frame">

    <!-- NAME / HOME BUTTON -->

    <header class="site-header">

      <button
        class="pixel-name js-home"
        type="button"
        aria-label="Home"
      >
        sophia bennett holmes
      </button>

    </header>


    <!-- MAIN LAYOUT -->

    <main class="layout">

      <!-- LEFT SIDEBAR -->

      <aside class="sidebar">

        <button
          class="category js-category"
          data-category="bts"
          type="button"
        >
          BTS
        </button>

        <button
          class="category js-category"
          data-category="events"
          type="button"
        >
          EVENTS
        </button>

        <button
          class="category js-category"
          data-category="portraits"
          type="button"
        >
          PORTRAITS
        </button>

        <button
          class="category js-category"
          data-category="objects"
          type="button"
        >
          OBJECTS
        </button>

      </aside>


      <!-- PHOTOGRAPH -->

      <section class="photo-area">

        <div
          class="photo-grid"
          id="photoGrid"
        ></div>

        <div
          class="empty-state"
          id="emptyState"
          hidden
        >
          <p>No photographs in this section yet.</p>
        </div>

      </section>

    </main>


    <!-- BOTTOM CORNERS -->

    <div class="contact">
      contact: sophia@streetnine.com
    </div>

    <div class="corner-mark">
      photo portfolio
    </div>

  </div>


  <!-- IMPORTANT: photos.js BEFORE script.js -->

  <script src="photos.js"></script>
  <script src="script.js"></script>

</body>
</html>
